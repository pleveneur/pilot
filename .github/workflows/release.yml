name: release

# Déclencheur : création d'un tag de version (ex: v0.2.0).
# Le tag doit correspondre à la version déjà présente dans tauri.conf.json,
# Cargo.toml et package.json (bump local avant de tagger — voir AGENTS.md).
# L'updater compare ce numéro à la version courante de l'app installée.
on:
  push:
    tags:
      - "v*"

# Permissions requises pour créer la GitHub Release et uploader les assets.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # test — lance les tests unitaires Rust ET JS avant toute release (garde-fou
  # anti-régression). Tourne sur les 3 OS (matrice) : les tests sont
  # cross-plateforme (logique pure : auth, rate-limit, chunking, parsing,
  # orchestration, reviewer). Le build dépend de cette job : une régression
  # testée bloque la release.
  # ─────────────────────────────────────────────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Plafond de durée : un job bloqué reste sinon suspendu jusqu'au maximum GitHub
    # (blocage sans aucune erreur constaté le 2026-10-01 sur la cible Linux).
    timeout-minutes: 30
    # TOLÉRÉ sur macOS : `build` déclare `needs: [create-release, test]`, donc une
    # machine macOS indisponible (pénurie de runners arm64 — incident ayant publié
    # v0.4.26 SANS aucun installateur, job « not acquired by Runner of type
    # hosted ») faisait échouer TOUTE la fabrication, y compris Windows et Linux.
    # Un échec/machine manquante côté macOS est désormais signalé mais non
    # bloquant ; les tests macOS tournent toujours quand un runner est obtenu.
    # Même mécanisme que le job `build` pour la cible Linux ci-dessous.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Migration bytes must be LF (stable sqlx checksums)
        # sqlx compare une empreinte SHA-384 du CONTENU des migrations. Un CRLF
        # (worktree Windows avec core.autocrlf, sans .gitattributes) change
        # l'empreinte embarquée et invalide `_sqlx_migrations`
        # (MigrateError::VersionMismatch). Garde permanente : tout fichier de
        # migration doit être en LF (index ET worktree).
        # Chemin : `gds-core/migrations/` depuis la refonte GDS (L1.3) ; ce garde
        # est VIDE (donc sans effet) si le chemin n'existe pas.
        shell: bash
        run: |
          echo "Vérification des fins de ligne des migrations (LF attendu)"
          ! git ls-files --eol gds-core/migrations | grep -v 'i/lf.*w/lf'
      - name: Switch apt mirror (azure → archive)
        # Le miroir par défaut des runners ubuntu-22.04 (azure.archive.ubuntu.com)
        # est mort : apt-get update bloquait le job 2h+ (suspendu indéfiniment).
        # On bascule vers archive.ubuntu.com avant toute opération apt.
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's@azure\.archive\.ubuntu\.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's@azure\.archive\.ubuntu\.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list 2>/dev/null || true
      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Forcer IPv4 + timeouts/retries : évite le blocage du miroir Ubuntu
          # (le job restait suspendu indéfiniment sur apt-get).
          export APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::http::ConnectionAttemptTimeout=10"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm (Pilot + LayaPL)
        # Même cache `~/.npm` par système que les jobs de fabrication (même clé) :
        # un seul téléchargement des paquets sert à tous les jobs du système.
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install npm deps
        run: npm ci --prefer-offline
      - name: Generate MCP bundle (build:mcp)
        # Le fichier src-tauri/extensions/pilot-mcp-client.ts est VOLONTAIREMENT exclu
        # du dépôt (.gitignore, « regenerated by npm run build:mcp ») mais est embarqué
        # via include_str! par la compilation Rust. Il doit donc être généré AVANT tout
        # `cargo test`/`cargo build`, sinon la compilation échoue (fichier introuvable).
        run: npm run build:mcp
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Run JS unit tests (Vitest)
        run: npm test

  # ─────────────────────────────────────────────────────────────────────
  # create-release — crée la GitHub Release (idempotent) AVANT les builds
  # pour éviter la condition de course "already_exists" : sans cette étape,
  # chaque tauri-action de la matrice tenterait de créer la release en
  # parallèle, et seules les premières réussiraient.
  # ─────────────────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create GitHub Release (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-release.js "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"

  # ─────────────────────────────────────────────────────────────────────
  # build — compile l'app sur Windows et macOS et génère les artefacts
  # signés (NSIS / DMG) via tauri-action. Les fichiers .sig servent à
  # latest-json. La cible Linux a son propre job (`build-linux`) pour ne
  # jamais retenir cette branche.
  # ─────────────────────────────────────────────────────────────────────
  build:
    needs: [create-release, test]
    strategy:
      fail-fast: false
      matrix:
        # Windows + macOS SEULEMENT : la cible Linux est fabriquée par le job
        # `build-linux` (plus bas). Motif mesuré : Linux, annulé par son
        # plafond, retenait `latest-json` (donc la mise à jour automatique de
        # TOUS les utilisateurs) pendant ~30 min sans livrer un seul paquet.
        #
        # `rust_cache_targets` : budget de cache du dépôt (10 Go au total, avec
        # éviction LRU). Les 2 cibles macOS n'enregistrent PAS leur dossier
        # `target/` (~2 Go chacune) — elles se compilent en 6 à 10 min — alors
        # que Windows et Linux, qui le gardent, pèsent ~2,5-3 Go chacun.
        # Total visé : ~5-6 Go de `target/` + ~1,5 Go de registre Cargo/outils
        # + ~1 Go de paquets npm ≈ 8 Go : sous la limite, donc plus d'éviction
        # mutuelle (c'est l'éviction qui provoquait des compilations à froid).
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            laya_platform: win32/x64
            rust_cache_targets: "true"
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            laya_platform: darwin/arm64
            rust_cache_targets: "false"
          # macOS Intel : le moteur ONNX utilisé par le service n'existe plus pour
          # darwin/x64 (onnxruntime-node ne livre plus qu'arm64 côté macOS). On
          # continue SANS Laya sur cette seule cible — l'écran le dit alors
          # explicitement (« n'embarque pas le service Laya ») au lieu de
          # l'annoncer à tort. Les 3 autres cibles l'embarquent et sont STRICTES.
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            laya_platform: darwin/x64
            laya_allow_missing: "1"
            rust_cache_targets: "false"

    runs-on: ${{ matrix.platform }}
    # Plafond de durée : un job bloqué reste sinon suspendu jusqu'au maximum GitHub
    # (blocage sans aucune erreur constaté le 2026-10-01). 45 min est un simple
    # filet de sécurité : Windows boucle sa fabrication en ~14 min à cache chaud
    # et les 2 cibles macOS en 6 à 10 min. La cible Linux, elle, n'est plus dans
    # cette matrice (job `build-linux`) : plus aucun dépassement de sa part ne
    # peut retenir ce job, donc `latest-json`.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Récupérer la source LayaPL (service embarqué)
        # Source HORS dépôt Pilot (dépôt et licence distincts) : récupérée ici
        # pour que le service soit RÉELLEMENT embarqué dans le paquet publié.
        # Placée à côté du dépôt Pilot (rien n'est versionné dans ce dépôt).
        run: git clone --depth 1 https://github.com/pleveneur/LayaPL.git "${{ github.workspace }}/../LayaPL"

      - name: Cache npm (Pilot + LayaPL)
        # UN SEUL cache `~/.npm` par système : il sert à la fois au `npm ci` du
        # dépôt et au `npm ci --omit=dev` de LayaPL (les deux partagent le cache
        # npm). Sans lui, les mêmes paquets étaient retéléchargés dans chacune
        # des tâches qui installent (test ×3, build ×2, build-linux ×1).
        # Clé : empreinte du verrou du dépôt ; `restore-keys` rattrape les
        # versions voisines (npm valide l'intégrité de chaque paquet, donc un
        # cache plus ancien ne peut pas installer un paquet corrompu).
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Installer les dépendances de LayaPL (moteur ONNX + bibliothèque)
        # `laya-ts/dist` est versionné ; seuls les paquets npm sont à installer
        # (`onnxruntime-node` fournit le moteur natif par plateforme).
        # `--prefer-offline` : se sert du cache restauré ci-dessus au lieu de
        # revalider chaque paquet auprès du registre (repli réseau automatique).
        working-directory: ${{ github.workspace }}/../LayaPL/laya-ts
        run: npm ci --omit=dev --prefer-offline

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust (compilation à froid)
        # Réduit la compilation à froid. Les entrées par défaut conviennent : le
        # workspace Cargo vit à la RACINE du dépôt (`Cargo.toml` + `Cargo.lock`
        # + `target/`, membres `src-tauri`, `gds-core`, `gds-server`) →
        # `workspaces` par défaut = ". -> target".
        # `key` est NÉCESSAIRE ici : la clé automatique contient l'id de job et
        # l'hôte rustc, PAS les valeurs de la matrice — les deux entrées macOS
        # partagent donc le même runner (macos-latest, hôte arm64) et se
        # remplaceraient mutuellement la même entrée de cache.
        # `cache-on-failure` : un job interrompu doit tout de même enregistrer
        # ses dépendances compilées, sinon le run suivant repaye le même temps de
        # calcul (les étapes « post » tournent après annulation).
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}
          cache-on-failure: "true"
          # Budget de cache (cf. commentaire de la matrice) : `target/`
          # uniquement pour les cibles lentes (Windows, Linux).
          cache-targets: ${{ matrix.rust_cache_targets }}

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: Generate MCP bundle (build:mcp)
        # Même prérequis que la job `test` : le bundle MCP (pilot-mcp-client.ts) est
        # exclu du dépôt mais requis par include_str! à la compilation Rust. Il doit
        # être généré avant le build Tauri, sinon cargo échoue (exit 101).
        run: npm run build:mcp

      # Le service Laya n'est PLUS préparé par une étape séparée :
      # `beforeBuildCommand` (tauri.conf.json) lance déjà
      # `prepare:laya && npm run build`, avec les MÊMES variables d'environnement
      # (LAYA_SOURCE_DIR / LAYA_TARGET_PLATFORM / LAYA_ALLOW_MISSING ci-dessous).
      # L'étape explicite recopiait donc ~114 Mo de binaires une SECONDE fois
      # dans chaque job. Le garde-fou est intact : `prepare:laya` échoue toujours
      # si le service est incomplet, et cet échec fait échouer l'action (donc le
      # job).

      - name: Build and sign Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # Clé privée de signature de l'updater (générée via
          # `npm run tauri signer generate`). À stocker dans les secrets
          # du dépôt GitHub sous le nom TAURI_SIGNING_PRIVATE_KEY
          # (et TAURI_SIGNING_PRIVATE_KEY_PASSWORD si la clé est protégée).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # `beforeBuildCommand` lance `prepare:laya` (puis `npm run build`) :
          # c'est le SEUL endroit où le service est recopié, et il échoue si le
          # service est incomplet (garde-fou conservé, une seule copie).
          LAYA_SOURCE_DIR: ${{ github.workspace }}/../LayaPL
          LAYA_TARGET_PLATFORM: ${{ matrix.laya_platform }}
          LAYA_ALLOW_MISSING: ${{ matrix.laya_allow_missing }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pilot ${{ github.ref_name }}"
          releaseBody: "Téléchargez et installez le binaire correspondant à votre plateforme. La mise à jour automatique est active pour les versions suivantes."
          releaseDraft: false
          prerelease: false
          # On désactive la génération/upload automatique de latest.json par
          # tauri-action : ce dernier utiliserait le releaseBody fixe (sans
          # changelog). Le job `latest-json` ci-dessous génère un latest.json
          # avec le changelog (depuis les commits) et l'upload lui-même.
          includeUpdaterJson: false
          args: --target ${{ matrix.rust_target }}

  # ─────────────────────────────────────────────────────────────────────
  # build-linux — fabrication de la cible Linux, SÉPARÉE de Windows/macOS.
  #
  # Ce que ce découpage corrige (mesuré sur la publication précédente) : le
  # job Linux, annulé par son plafond de 45 min, retenait `latest-json` — donc
  # la mise à jour automatique de TOUS les utilisateurs — pendant ~30 min pour
  # une branche qui ne livrait aucun paquet.
  #
  # Règles tenues ici :
  #   1. ce job ne retarde RIEN : aucun job n'a `needs: build-linux` (la
  #      seconde passe `latest-json-linux`, plus bas, tourne APRÈS latest-json
  #      et seulement si Linux a vraiment livré) ;
  #   2. il ne fait jamais échouer la publication (continue-on-error) ;
  #   3. son plafond (90 min) dépasse largement sa durée réelle, pour qu'il
  #      puisse ALLER AU BOUT et donc enregistrer son cache (c'est la boucle
  #      infernale corrigée : annulé ⇒ cache perdu ⇒ recompilation à froid ⇒
  #      annulé encore).
  build-linux:
    needs: [create-release, test]
    runs-on: ubuntu-22.04
    # Plafond RELEVÉ de 45 à 90 min. Calcul :
    #  - mesuré : à 45 min la branche compilait encore et se faisait annuler
    #    (aucun paquet produit, cache jamais enregistré) ;
    #  - une compilation Rust à froid de cette taille (workspace Tauri + axum +
    #    sqlx + 4 crates du dépôt) coûte 3 à 4 fois le temps à cache chaud ;
    #    Windows, à cache chaud, boucle sa fabrication complète en ~14 min ;
    #  - s'y ajoutent apt (~3 min), les deux `npm ci` (~3 min), le clone et
    #    l'installation des paquets de LayaPL, et l'empaquetage AppImage
    #    (linuxdeploy, ~3 min) ;
    #  - 90 min ≈ 2 × le plafond qui échouait : de quoi finir À FROID et
    #    enregistrer le cache la première fois ; ensuite, à cache chaud, la
    #    branche doit retomber vers ~15-20 min (à mesurer).
    timeout-minutes: 90
    # Une fabrication Linux cassée ne fait pas échouer la publication.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Récupérer la source LayaPL (service embarqué)
        run: git clone --depth 1 https://github.com/pleveneur/LayaPL.git "${{ github.workspace }}/../LayaPL"

      - name: Cache npm (Pilot + LayaPL)
        # Même cache `~/.npm` que les autres jobs (même clé par système) : il
        # est partagé, pas dupliqué.
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Installer les dépendances de LayaPL (moteur ONNX + bibliothèque)
        working-directory: ${{ github.workspace }}/../LayaPL/laya-ts
        run: npm ci --omit=dev --prefer-offline

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust (compilation à froid)
        # `target/` conservé pour cette cible : c'est la plus lente à compiler,
        # et c'est précisément son cache qui manquait (job annulé avant l'étape
        # d'enregistrement). `cache-on-failure` reste vrai par sécurité.
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
          cache-on-failure: "true"
          cache-targets: "true"

      - name: Switch apt mirror (azure → archive)
        # Même correctif que dans la job `test` : éviter le blocage de
        # apt-get update sur le miroir Azure mort des runners ubuntu-22.04.
        run: |
          sudo sed -i 's@azure\.archive\.ubuntu\.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's@azure\.archive\.ubuntu\.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list 2>/dev/null || true
      - name: Install Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Forcer IPv4 + timeouts/retries : évite le blocage du miroir Ubuntu
          # (le job restait suspendu indéfiniment sur apt-get).
          export APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Acquire::http::ConnectionAttemptTimeout=10"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: Generate MCP bundle (build:mcp)
        # Même prérequis que les autres jobs : `pilot-mcp-client.ts` est exclu du
        # dépôt mais embarqué par include_str! à la compilation Rust.
        run: npm run build:mcp

      - name: Build and sign Tauri app
        # L'ancienne étape « Compilation release (cible Linux uniquement) » est
        # SUPPRIMÉE : elle lançait `npm run build` puis
        # `cargo build --release`, que cette action refait derrière
        # (`beforeBuildCommand` construit le front, puis tauri-cli compile avec
        # la même feature `tauri/custom-protocol` qu'elle ajoute lui-même). La
        # compilation était donc faite DEUX fois sur Linux. Aucune étape de
        # diagnostic n'est conservée : la durée de compilation et celle de
        # l'empaquetage se lisent désormais dans cette seule étape et dans la
        # durée du job (les deux sont séparées par les horodatages du run).
        # `prepare:laya` n'est pas non plus relancé ici : `beforeBuildCommand`
        # le fait déjà, une seule fois, avec les mêmes variables.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LAYA_SOURCE_DIR: ${{ github.workspace }}/../LayaPL
          LAYA_TARGET_PLATFORM: linux/x64
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pilot ${{ github.ref_name }}"
          releaseBody: "Téléchargez et installez le binaire correspondant à votre plateforme. La mise à jour automatique est active pour les versions suivantes."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target x86_64-unknown-linux-gnu

  # ─────────────────────────────────────────────────────────────────────
  # latest-json — génère le fichier latest.json agrégeant les signatures
  # de toutes les plateformes et l'upload sur la release. C'est ce fichier
  # que l'updater télécharge via l'endpoint configuré dans tauri.conf.json
  # (releases/latest/download/latest.json).
  # ─────────────────────────────────────────────────────────────────────
  latest-json:
    # Plafond de durée : un job bloqué reste sinon suspendu jusqu'au maximum GitHub
    # (blocage sans aucune erreur constaté le 2026-10-01).
    timeout-minutes: 20
    # Doit tourner même si une cible de la matrice `build` a échoué, sinon
    # latest.json — donc la mise à jour automatique — ne serait jamais déposé.
    #
    # `needs: build` UNIQUEMENT : ce job ne dépend PLUS de la fabrication Linux
    # (job `build-linux`, indépendant). C'est le cœur du correctif : l'index des
    # mises à jour, et donc la mise à jour de tous les utilisateurs, n'attend
    # plus une branche qui peut dépasser son plafond.
    # Contenu INCHANGÉ : scripts/gen-latest-json.js n'exige qu'UNE plateforme
    # signée et parcourt les assets réellement présents. Linux n'y figurait déjà
    # pas (l'index de la 0.4.39 ne contient que Windows + les deux macOS), donc
    # ce découplage ne retire rien à personne. Si Linux aboutit AVANT ce job, il
    # y est inclus automatiquement ; s'il aboutit après, la seconde passe
    # `latest-json-linux` (plus bas) l'ajoute.
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Récupère tout l'historique + tags pour générer le changelog
          # entre le tag précédent et le tag courant.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate and upload latest.json (changelog + signatures + body)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-latest-json.js "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" latest.json

  # ─────────────────────────────────────────────────────────────────────
  # latest-json-linux — seconde passe OPTIONNELLE de l'index des mises à jour,
  # qui remet Linux dans latest.json QUAND (et seulement quand) sa fabrication a
  # réellement déposé ses artefacts.
  #
  # Pourquoi une seconde passe plutôt qu'un `needs` : un `needs` ferait
  # attendre l'index (donc tout le monde) au cas où Linux échoue — exactement
  # le défaut corrigé. Ici, le chemin normal (Linux en échec) ne fait RIEN :
  # le job se contente de constater l'absence d'artefact AppImage et s'arrête.
  # Il ne peut jamais retarder latest-json (il démarre après) ni faire échouer
  # la publication (continue-on-error).
  # ─────────────────────────────────────────────────────────────────────
  latest-json-linux:
    needs: [latest-json, build-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Le changelog se calcule entre deux tags : historique complet requis.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: La fabrication Linux a-t-elle deja depose ses artefacts ?
        id: linux-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(curl -sSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | jq '[.assets[].name | select(test("\\.AppImage(\\.sig)?$"))] | length')
          # Reponse inattendue (API indisponible, jeton sans droit) : on ne fait
          # rien plutot que d'echouer bruyamment.
          case "$count" in ''|*[!0-9]*) count=0 ;; esac
          echo "artefacts AppImage (binaire + signature) : $count"
          if [ "$count" -ge 2 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Aucun artefact Linux complet : latest.json (Windows + macOS) est laisse tel quel."
          fi

      - name: Regenerate latest.json with Linux
        if: steps.linux-assets.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-latest-json.js "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" latest.json