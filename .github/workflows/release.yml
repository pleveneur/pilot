name: release

# Déclencheur : création d'un tag de version (ex: v0.2.0).
# Le tag doit correspondre à la version déjà présente dans tauri.conf.json,
# Cargo.toml et package.json (bump local avant de tagger — voir AGENTS.md).
# L'updater compare ce numéro à la version courante de l'app installée.
on:
  push:
    tags:
      - "v*"

# Permissions requises pour créer la GitHub Release et uploader les assets.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # test — lance les tests unitaires Rust ET JS avant toute release (garde-fou
  # anti-régression). Tourne sur les 3 OS (matrice) : les tests sont
  # cross-plateforme (logique pure : auth, rate-limit, chunking, parsing,
  # orchestration, reviewer). Le build dépend de cette job : une régression
  # testée bloque la release.
  # ─────────────────────────────────────────────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Switch apt mirror (azure → archive)
        # Le miroir par défaut des runners ubuntu-22.04 (azure.archive.ubuntu.com)
        # est mort : apt-get update bloquait le job 2h+ (suspendu indéfiniment).
        # On bascule vers archive.ubuntu.com avant toute opération apt.
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's@azure\.archive\.ubuntu\.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's@azure\.archive\.ubuntu\.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list 2>/dev/null || true
      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install npm deps
        run: npm ci
      - name: Run JS unit tests (Vitest)
        run: npm test

  # ─────────────────────────────────────────────────────────────────────
  # create-release — crée la GitHub Release (idempotent) AVANT les builds
  # pour éviter la condition de course "already_exists" : sans cette étape,
  # chaque tauri-action de la matrice tenterait de créer la release en
  # parallèle, et seules les premières réussiraient.
  # ─────────────────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create GitHub Release (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-release.js "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"

  # ─────────────────────────────────────────────────────────────────────
  # build — compile l'app sur les 3 plateformes et génère les artefacts
  # signés (NSIS / DMG / AppImage) via tauri-action. Les fichiers .sig
  # ─────────────────────────────────────────────────────────────────────
  build:
    needs: [create-release, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Switch apt mirror (azure → archive)
        # Même correctif que dans la job `test` : éviter le blocage de
        # apt-get update sur le miroir Azure mort des runners ubuntu-22.04.
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo sed -i 's@azure\.archive\.ubuntu\.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's@azure\.archive\.ubuntu\.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list 2>/dev/null || true
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Build and sign Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # Clé privée de signature de l'updater (générée via
          # `npm run tauri signer generate`). À stocker dans les secrets
          # du dépôt GitHub sous le nom TAURI_SIGNING_PRIVATE_KEY
          # (et TAURI_SIGNING_PRIVATE_KEY_PASSWORD si la clé est protégée).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pilot ${{ github.ref_name }}"
          releaseBody: "Téléchargez et installez le binaire correspondant à votre plateforme. La mise à jour automatique est active pour les versions suivantes."
          releaseDraft: false
          prerelease: false
          # On désactive la génération/upload automatique de latest.json par
          # tauri-action : ce dernier utiliserait le releaseBody fixe (sans
          # changelog). Le job `latest-json` ci-dessous génère un latest.json
          # avec le changelog (depuis les commits) et l'upload lui-même.
          updaterJson: false
          args: --target ${{ matrix.rust_target }}

  # ─────────────────────────────────────────────────────────────────────
  # latest-json — génère le fichier latest.json agrégeant les signatures
  # de toutes les plateformes et l'upload sur la release. C'est ce fichier
  # que l'updater télécharge via l'endpoint configuré dans tauri.conf.json
  # (releases/latest/download/latest.json).
  # ─────────────────────────────────────────────────────────────────────
  latest-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Récupère tout l'historique + tags pour générer le changelog
          # entre le tag précédent et le tag courant.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate and upload latest.json (changelog + signatures + body)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-latest-json.js "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" latest.json