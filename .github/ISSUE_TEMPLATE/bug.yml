name: 🐛 Bug
description: Signaler un comportement incorrect ou un plantage
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Que se passe-t-il ? Quel était le résultat attendu ?
      placeholder: "Décrivez le problème…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Pilot
      placeholder: "ex: v0.2.14"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Système d'exploitation
      placeholder: "ex: Windows 11 / macOS 14 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / captures (optionnel)
      description: Messages d'erreur, captures d'écran, contexte supplémentaire.
      render: shell
    validations:
      required: false