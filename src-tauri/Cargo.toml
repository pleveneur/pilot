[package]
name = "pilot"
version = "0.2.65"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
open = "5"
portable-pty = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# ── Serveur web distant (mode remote) ──
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
argon2 = "0.5"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
include_dir = "0.7"
qrcode = "0.14"

# ── GDS (Gestionnaire de Sources, spec_gds.md) : PostgreSQL ──
# ── Context Engine V2 (RAG embeddings) ──
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tree-sitter = "0.26.11"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"

# ── Terminal intégré (Windows) : PATH complet depuis la registry ──
# Le PTY hérite de l'environnement du processus Pilot, qui peut ne pas avoir
# le PATH utilisateur complet (ex: .cargo\bin). On le reconstruit depuis la
# registry (HKLM système + HKCU utilisateur) pour que les commandes comme
# `cargo` soient trouvées dans le terminal intégré.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_System_Environment"] }

# ── Patch local de wry (autorise le micro du WebView desktop pour la dictée vocale) ──
# Voir `vendor/wry/src/webview2/mod.rs` (handler PermissionRequested).
# À re-appliquer à chaque montée de version de Tauri / wry.
[patch.crates-io]
wry = { path = "vendor/wry" }
