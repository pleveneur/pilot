; supervisord.conf — surveillance des trois processus du conteneur GDS (L2.7)
;
; Le conteneur est « tout-en-un » (décision 1 figée) : PostgreSQL (base + suivi),
; sshd (dépôts git par SSH) et gds-server (API HTTP + jobs de maintenance) vivent
; dans le MÊME conteneur. `supervisord` est le processus final lancé par le
; script d'entrée : il démarre les trois, les redémarre s'ils tombent et les
; arrête proprement sur SIGTERM. Aucun socket du moteur Docker n'est monté : la
; supervision est INTERNE au conteneur.
;
; Le script d'entrée a déjà fait le bootstrap avant de confier la main :
;   - instance PostgreSQL créée sur le volume si vide (`initdb`) ;
;   - rôle + base `pilot_gds` + migrations (`gds-server --init-db`) ;
;   - compte système `git`, racine des dépôts et fichier des clefs autorisées
;     régénéré depuis la base (`gds-server --init-ssh`) ;
;   - clefs d'hôte (volume) et configuration sshd rendue puis validée (`sshd -t`).
; La base de BOOTSTRAP est arrêtée juste avant : le postmaster surveillé est donc
; le seul à écouter le port, ce qui évite un conteneur « à moitié mort ».
;
; Les journaux sont dirigés vers la sortie standard et la sortie d'erreur (donc
; visibles avec `docker logs`) — c'est là qu'on lit « base prête », « migrations
; appliquées », « administrateur en attente d'initialisation », ainsi que les
; redémarrages décidés par le superviseur et les refus d'authentification sshd.

[supervisord]
nodaemon=true
user=root
; Journal du superviseur : fichier interne au conteneur. En mode « nodaemon »,
; supervisord écrit DÉJÀ ses messages sur la sortie standard : pointer aussi
; `logfile` sur /dev/stdout doublerait chaque ligne dans `docker logs` (constaté
; à l'essai). Le fichier sert au diagnostic (`docker exec … cat`) ; les arrêts et
; redémarrages décidés par le superviseur sont donc visibles à la fois dans
; `docker logs` et ici.
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

; `supervisorctl` permet un diagnostic local immédiat
; (`docker exec … supervisorctl status`). Le service s'en sert AUSSI pour son
; propre cycle de vie (L2.10) : les routes d'administration
; `POST /api/gds/admin/service/restart` et `/service/stop` interrogent l'état par
; `supervisorctl … status`, puis transmettent l'ordre (différé de quelques
; centièmes de seconde) par le MÊME socket — c'est pourquoi il doit rester
; accessible au compte qui exécute `gds-server` (root dans l'image livrée).
; Aucun socket du moteur Docker n'est monté : le conteneur ne peut pas se
; piloter lui-même de l'extérieur.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ── 1. PostgreSQL ───────────────────────────────────────────────────────────
; Lancé par le PROPRIÉTAIRE du cluster (`user=postgres` : le moteur refuse de
; tourner en root). `user=postgres` est le compte livré par l'image de base.
; `stopsignal=INT` = arrêt « fast » ; `stopwaitsecs` laisse le temps d'un arrêt
; propre. `startretries` borne les tentatives : après échec répété, supervisord
; déclare le processus FATAL — le conteneur ne reste donc jamais silencieusement
; à moitié mort.
[program:postgres]
command=%(ENV_GDS_PG_BIN)s -D %(ENV_PGDATA)s -c listen_addresses=0.0.0.0 -c port=%(ENV_GDS_DB_PORT)s
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── 2. sshd : dépôts git, par clef uniquement ───────────────────────────────
; `-D` : premier plan (sinon supervisord croirait le processus mort à chaque
; détachement) ; `-e` : journal sur la sortie d'erreur (le conteneur n'a pas de
; démon syslog, et on veut les journaux dans `docker logs`) ; `-f` :
; configuration rendue et validée par le script d'entrée. La restriction
; `AllowUsers git` + `AuthenticationMethods publickey` est dans ce fichier.
[program:sshd]
command=%(ENV_GDS_SSHD_BIN)s -D -e -f /etc/ssh/sshd_config.gds
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── 3. gds-server : API HTTP + jobs de maintenance ──────────────────────────
; Le service démarre même si PostgreSQL n'est pas encore prêt : il réessaie la
; connexion avec une attente progressive (30 tentatives) puis échoue clairement,
; et supervisord peut le relancer.
;
; Cycle de vie piloté par Pilot (L2.10) : `restart` et `stop` visent CE programme
; ET `sshd` (le service d'accès par clef), jamais `postgres` — l'arrêt du service
; ne coupe donc ni la base ni les données. Un `stop` reste un état stable :
; `autorestart` ne s'applique pas à un arrêt demandé. Pour repartir :
; `docker compose restart gds` (ou `supervisorctl start gds-server sshd`).
[program:gds-server]
command=/usr/local/bin/gds-server
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
