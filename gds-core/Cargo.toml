[package]
name = "gds-core"
version = "0.4.16"
edition = "2021"
description = "Socle GDS partagé entre l'application desktop Pilot et le binaire serveur gds-server."
publish = false

# Aucune dépendance Tauri dans ce crate : il est aussi compilé par `gds-server`,
# binaire headless destiné au conteneur (plan de refonte GDS, §2.10).
# Les modules (db, git, git_cmd, ssh, auth, rate, audit, http, config, roles,
# server_status) sont extraits depuis `src-tauri` au fil du lot L1.
[dependencies]
# Authentification du serveur web / GDS (module `auth`, ex `web_auth.rs`).
argon2 = "0.5"
# Routeur HTTP GDS partagé (module `http`, ex `gds_web.rs`) : mêmes types axum
# que le desk (0.7) pour que le serveur autonome et le desk montent le même
# routeur. Le desk active en plus la feature `ws` (WebSocket) de son côté ;
# cargo unifie les features sur la version unique du workspace.
axum = "0.7"
# Accès PostgreSQL du GDS (`db`) — mêmes versions/features que le desk pour
# n'avoir qu'une seule version résolue dans le workspace.
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
# `git` s'appuie sur `tokio::task::spawn_blocking` (création du dépôt bare,
# bloquante). Le runtime complet n'est pas nécessaire côté bibliothèque.
tokio = { version = "1", features = ["rt"] }

# `db` embarque ses tests (`#[tokio::test]`) : il leur faut un runtime tokio.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
