# Workspace Cargo du mono-repo Pilot (refonte GDS, décision 12).
#
# Membres :
#   - `src-tauri`  : application desktop (Tauri v2).
#   - `gds-core`   : socle partagé desktop ↔ serveur (créé en L1.2).
#   - `gds-server` : binaire serveur GDS headless (créé en L1.2).
#
# Conséquence de la création du workspace : le verrou de dépendances
# (`Cargo.lock`) et le répertoire de compilation (`target/`) vivent désormais à
# la RACINE du dépôt (auparavant `src-tauri/`). Les deux sont couverts par
# `.gitignore` (`target/` pour la compilation).
[workspace]
resolver = "2"
members = ["src-tauri", "gds-core", "gds-server"]

# ── Patch local de wry (autorise le micro du WebView desktop pour la dictée vocale) ──
# Voir `src-tauri/vendor/wry/src/webview2/mod.rs` (handler PermissionRequested).
# À re-appliquer à chaque montée de version de Tauri / wry.
#
# IMPORTANT : une section `[patch]` n'est honorée QUE par le manifeste racine du
# workspace. Elle a donc été déplacée depuis `src-tauri/Cargo.toml` lors de la
# création du workspace : la laisser dans un membre la ferait silencieusement
# ignorer (le correctif de dictée vocale disparaîtrait).
[patch.crates-io]
wry = { path = "src-tauri/vendor/wry" }
# ── `whisper-rs-sys` patché localement : l'OREILLE INTÉGRÉE COMPILE SANS LLVM ──
# `whisper-rs-sys` génère ses liaisons FFI avec `bindgen`, qui exige `libclang`
# et dont le chargeur PANIQUE quand il est absent (le repli prévu par l'amont
# n'est jamais atteint) : sans ce correctif, la feature `whisper` ne compilait
# que sur une machine fournie en LLVM. La copie locale (crate 0.15.0 à
# l'identique) change EXACTEMENT deux choses (détail et re-application :
# `src-tauri/vendor/whisper-rs-sys/VENDOR-PATCH.md`) :
#   1. `build.rs` emploie les liaisons PRÉ-GÉNÉRÉES livrées par l'amont dès que
#      `libclang` est introuvable (comportement identique s'il est présent) ;
#   2. `src/bindings.rs` borne à `target_env = "gnu"` trois assertions de
#      disposition qui ne décrivaient que `stdio.h` de la glibc (aucun type de
#      l'API Whisper) — c'est ce qui faisait échouer Windows et macOS.
# Rien d'autre n'est modifié : whisper.cpp est compilé par cmake + MSVC, comme
# l'amont le prévoit, et le build PAR DÉFAUT n'active toujours pas la feature.
whisper-rs-sys = { path = "src-tauri/vendor/whisper-rs-sys" }
